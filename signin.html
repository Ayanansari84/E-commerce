<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/4/4a/Amazon_icon.svg" />
    <title>Amazon Sign In</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo-container {
            margin-top: 20px;
            margin-bottom: 20px;
        }
        .logo-container img {
            width: 100px;
        }
        .signin-container {
            width: 350px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px 25px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        .signin-container h1 {
            font-size: 28px;
            font-weight: 400;
            margin-bottom: 15px;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #949494;
            border-radius: 3px;
            box-sizing: border-box;
        }
        .form-group input:focus {
            border-color: #e77600;
            box-shadow: 0 0 3px 2px rgba(228,121,17,.5);
            outline: 0;
        }
        .continue-btn {
            width: 100%;
            background-color: #f0c14b;
            border: 1px solid;
            border-color: #a88734 #9c7e31 #846a29;
            border-radius: 3px;
            color: #111;
            padding: 8px;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 1px 0 rgba(255,255,255,.4) inset;
        }
        .continue-btn:hover {
            background-color: #f4d078;
        }
        .legal-text {
            font-size: 12px;
            margin-top: 15px;
        }
        .legal-text a {
            color: #0066c0;
            text-decoration: none;
        }
        .legal-text a:hover {
            text-decoration: underline;
            color: #c45500;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <a href="index.html">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" alt="Amazon Logo">
        </a>
    </div>
    <div class="signin-container">
        <h1>Sign in</h1>
        <!-- Mocking form submission to redirect to index -->
        <form onsubmit="event.preventDefault(); window.location.href='index.html';">
            <div class="form-group">
                <label for="email">Email or mobile phone number</label>
                <input type="text" id="email" name="email" required>
            </div>
            <button type="submit" class="continue-btn">Continue</button>
        </form>
        <p class="legal-text">
            By continuing, you agree to Amazon's <a href="#">Conditions of Use</a> and <a href="#">Privacy Notice</a>.
        </p>
    </div>
</body>
</html>
